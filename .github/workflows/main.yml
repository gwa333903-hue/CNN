name: Build and Deploy

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inject GitHub Secret into app.js
        env:
          GG_TOKEN: ${{ secrets.GG_TOKEN }}
        run: |
          # Safely replace the placeholder in app.js with the repository secret
          sed -i 's|INJECTED_TOKEN_PLACEHOLDER|'"$GG_TOKEN"'|g' app.js

      - name: Verify Injection
        run: |
          echo "Secret injected successfully for deployment build."
          # Add your deployment commands here (e.g., Vercel CLI deployment if applicable)